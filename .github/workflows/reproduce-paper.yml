name: Reproduce archived Unreal analysis; smoke-test the Python model
on: [push, pull_request, workflow_dispatch]
jobs:
  analysis:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: archive/unreal/analysis/requirements-paper.txt
      - run: python -m pip install -r archive/unreal/analysis/requirements-paper.txt
      - run: python archive/unreal/analysis/reproduce.py
      - uses: r-lib/actions/setup-r@v2
        if: runner.os == 'Linux'
        with:
          use-public-rspm: true
      - run: Rscript --vanilla archive/unreal/analysis/plot_paper.R archive/unreal/analysis/generated/paper
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@v4
        with:
          name: paper-results-${{ matrix.os }}
          path: |
            archive/unreal/analysis/generated/paper/*.csv
            archive/unreal/analysis/generated/paper/reproduction.json
            archive/unreal/analysis/generated/paper/figures/
  model-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "numpy>=1.24"
      - name: Short trials with the saved stable-trained policies
        working-directory: model
        run: python smoke_test.py
