name: Reproduce paper
on: [push, pull_request, workflow_dispatch]
jobs:
  analysis:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analysis/requirements-paper.txt
      - run: python -m pip install -r analysis/requirements-paper.txt
      - run: python analysis/reproduce.py
      - uses: r-lib/actions/setup-r@v2
        if: runner.os == 'Linux'
        with:
          use-public-rspm: true
      - run: Rscript --vanilla analysis/plot_paper.R analysis/generated/paper
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@v4
        with:
          name: paper-results-${{ matrix.os }}
          path: |
            analysis/generated/paper/*.csv
            analysis/generated/paper/reproduction.json
            analysis/generated/paper/figures/
